<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LEVEL 0 // Coding Session</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --yellow: #d6c96a;
        --yellow-dark: #a69b3d;
        --wall: #c9bd55;
        --wall-dark: #8e8539;
        --black: #11100a;
        --red: #8f2929;
        --white: #eee8c8;
      }

      body {
        min-height: 100vh;
        color: var(--white);
        font-family: "Courier New", monospace;
        overflow-x: hidden;

        background: radial-gradient(
            ellipse at center,
            rgba(255, 247, 145, 0.12),
            transparent 55%
          ),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.025) 0,
            rgba(0, 0, 0, 0.025) 2px,
            transparent 2px,
            transparent 8px
          ),
          linear-gradient(180deg, #c8bc57 0%, #b8ad4e 55%, #91863b 100%);

        position: relative;
      }

      /* Vinheta */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;

        background: radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(0, 0, 0, 0.35) 100%
        );
      }

      /* Ruído */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 19;
        opacity: 0.06;

        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.3) 3px
        );
      }

      .ceiling {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        z-index: 1;

        background: repeating-linear-gradient(
          90deg,
          #aaa043 0,
          #aaa043 120px,
          #8d8437 121px,
          #8d8437 125px
        );

        border-bottom: 4px solid #716a30;
      }

      .light {
        position: absolute;
        top: 22px;
        width: 150px;
        height: 15px;

        background: #fffde1;
        box-shadow: 0 0 15px #fffbc7, 0 0 45px rgba(255, 255, 200, 0.8);

        animation: flicker 7s infinite;
      }

      .light:nth-child(1) {
        left: 12%;
      }

      .light:nth-child(2) {
        left: 42%;
        animation-delay: 2s;
      }

      .light:nth-child(3) {
        right: 10%;
        animation-delay: 4s;
      }

      @keyframes flicker {
        0%,
        91%,
        93%,
        100% {
          opacity: 1;
        }

        92% {
          opacity: 0.25;
        }
      }

      .floor {
        position: fixed;
        inset: 0;
        z-index: -1;

        background: repeating-linear-gradient(
            0deg,
            rgba(50, 45, 15, 0.08) 0,
            rgba(50, 45, 15, 0.08) 2px,
            transparent 2px,
            transparent 7px
          ),
          linear-gradient(180deg, transparent 65%, rgba(70, 55, 15, 0.2));

        transform: perspective(500px);
      }

      main {
        width: min(900px, 94%);
        margin: 0 auto;
        padding: 110px 0 60px;
        position: relative;
        z-index: 2;
      }

      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .level {
        font-size: clamp(0.75rem, 2vw, 1rem);
        letter-spacing: 0.4em;
        color: #5e571d;
        margin-bottom: 10px;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 3.5rem);
        letter-spacing: 0.12em;
        text-shadow: 3px 3px 0 rgba(70, 65, 20, 0.35),
          0 0 15px rgba(255, 255, 180, 0.2);
      }

      .subtitle {
        margin-top: 8px;
        color: #4c471b;
        font-size: 0.85rem;
      }

      .panel {
        padding: 30px;
        border: 2px solid rgba(45, 40, 10, 0.65);

        background: linear-gradient(
          135deg,
          rgba(30, 28, 10, 0.88),
          rgba(15, 14, 7, 0.94)
        );

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 0 30px rgba(0, 0, 0, 0.5);
      }

      .status {
        text-align: center;
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        color: var(--yellow);
        margin-bottom: 20px;
      }

      .status.rest {
        color: #82b4a2;
      }

      .timer {
        text-align: center;
        font-size: clamp(4rem, 15vw, 8rem);
        line-height: 1;
        letter-spacing: 0.04em;
        font-weight: bold;

        text-shadow: 0 0 15px rgba(214, 201, 106, 0.2);

        margin: 20px 0;
      }

      .timer.rest {
        color: #82b4a2;
      }

      .progress {
        width: 100%;
        height: 8px;
        background: #292713;
        margin: 25px 0;
        overflow: hidden;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: var(--yellow);
        box-shadow: 0 0 10px rgba(214, 201, 106, 0.5);
        transition: width 0.5s linear;
      }

      .info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 25px 0;
      }

      .info-box {
        padding: 15px;
        text-align: center;
        border: 1px solid #46421e;
        background: rgba(255, 255, 180, 0.025);
      }

      .info-label {
        color: #77713b;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        margin-bottom: 7px;
      }

      .info-value {
        color: var(--yellow);
        font-size: 1.1rem;
        font-weight: bold;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 25px;
      }

      button {
        font-family: inherit;
        font-weight: bold;
        letter-spacing: 0.08em;
        cursor: pointer;

        padding: 13px 25px;

        border: 1px solid var(--yellow-dark);
        color: var(--yellow);

        background: #18170c;

        transition: background 0.2s, color 0.2s, transform 0.2s;
      }

      button:hover {
        background: var(--yellow);
        color: #15140b;
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .settings {
        margin-top: 20px;
        padding-top: 25px;
        border-top: 1px solid #37341b;
      }

      .settings-title {
        text-align: center;
        color: #77713b;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        margin-bottom: 20px;
      }

      .inputs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      label {
        display: block;
        color: #77713b;
        font-size: 0.7rem;
        margin-bottom: 7px;
        letter-spacing: 0.08em;
      }

      input {
        width: 100%;
        padding: 12px;

        color: var(--yellow);
        background: #111008;

        border: 1px solid #403c1c;
        outline: none;

        font-family: inherit;
        font-size: 1rem;
      }

      input:focus {
        border-color: var(--yellow-dark);
        box-shadow: 0 0 8px rgba(214, 201, 106, 0.15);
      }

      .cycles {
        text-align: center;
        margin-top: 25px;
        color: #77713b;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
      }

      .cycles strong {
        color: var(--yellow);
      }

      .warning {
        text-align: center;
        margin-top: 25px;
        font-size: 0.7rem;
        color: #665f2c;
      }

      .backrooms-text {
        margin-top: 35px;
        text-align: center;
        color: rgba(40, 37, 10, 0.6);
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        animation: textPulse 5s infinite;
      }

      @keyframes textPulse {
        0%,
        100% {
          opacity: 0.5;
        }

        50% {
          opacity: 0.9;
        }
      }

      body.rest-mode {
        background: radial-gradient(
            ellipse at center,
            rgba(110, 170, 150, 0.12),
            transparent 60%
          ),
          linear-gradient(180deg, #a99e50, #81783a);
      }

      body.finished {
        background: radial-gradient(
            ellipse at center,
            rgba(140, 30, 30, 0.2),
            transparent 60%
          ),
          #6c6030;
      }

      @media (max-width: 650px) {
        main {
          padding-top: 100px;
        }

        .panel {
          padding: 20px 15px;
        }

        .info,
        .inputs {
          grid-template-columns: 1fr;
        }

        .controls {
          flex-direction: column;
        }

        button {
          width: 100%;
        }

        .light {
          width: 80px;
        }
      }
    </style>
  </head>

  <body>
    <div class="ceiling">
      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>
    </div>

    <div class="floor"></div>

    <main>
      <header class="header">
        <div class="level">LEVEL 0 // THE LOBBY</div>

        <h1>CODING SESSION</h1>

        <p class="subtitle">THERE IS NO RUSH. THERE IS ONLY THE NEXT CYCLE.</p>
      </header>

      <section class="panel">
        <div id="status" class="status">SYSTEM READY</div>

        <div id="timer" class="timer">50:00</div>

        <div class="progress">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="info">
          <div class="info-box">
            <div class="info-label">SESSION</div>

            <div id="sessionDisplay" class="info-value">03:00:00</div>
          </div>

          <div class="info-box">
            <div class="info-label">CYCLE</div>

            <div id="cycleDisplay" class="info-value">1 / 3</div>
          </div>

          <div class="info-box">
            <div class="info-label">MODE</div>

            <div id="modeDisplay" class="info-value">FOCUS</div>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn">START</button>

          <button id="pauseBtn">PAUSE</button>

          <button id="resetBtn">RESET</button>
        </div>

        <div class="settings">
          <div class="settings-title">SESSION CONFIGURATION</div>

          <div class="inputs">
            <div>
              <label for="maxHours"> MAX SESSION (MIN) </label>

              <input id="maxHours" type="number" min="1" value="180" />
            </div>

            <div>
              <label for="focusMinutes"> FOCUS (MIN) </label>

              <input id="focusMinutes" type="number" min="1" value="50" />
            </div>

            <div>
              <label for="restMinutes"> REST (MIN) </label>

              <input id="restMinutes" type="number" min="1" value="5" />
            </div>
          </div>
        </div>

        <div class="cycles">
          COMPLETED CYCLES:
          <strong id="completedCycles">0</strong>
        </div>

        <div class="warning">⚠ DO NOT GET LOST IN LEVEL 0</div>
      </section>

      <div class="backrooms-text">
        THE LIGHTS ARE ALWAYS ON.
        <br />
        KEEP CODING.
      </div>
    </main>

    <script>
      const timerElement = document.getElementById("timer");
      const statusElement = document.getElementById("status");

      const progressBar = document.getElementById("progressBar");

      const sessionDisplay = document.getElementById("sessionDisplay");

      const cycleDisplay = document.getElementById("cycleDisplay");

      const modeDisplay = document.getElementById("modeDisplay");

      const completedCyclesElement = document.getElementById("completedCycles");

      const maxHoursInput = document.getElementById("maxHours");

      const focusInput = document.getElementById("focusMinutes");

      const restInput = document.getElementById("restMinutes");

      const startButton = document.getElementById("startBtn");

      const pauseButton = document.getElementById("pauseBtn");

      const resetButton = document.getElementById("resetBtn");

      let timer = null;

      let running = false;

      let mode = "focus";

      let remaining = 0;

      let sessionElapsed = 0;

      let completedCycles = 0;

      let cycle = 1;

      function getSettings() {
        const maxSession = Math.max(1, Number(maxHoursInput.value)) * 60;

        const focus = Math.max(1, Number(focusInput.value));

        const rest = Math.max(1, Number(restInput.value));

        return {
          maxSession,
          focus,
          rest,
        };
      }

      function formatTime(seconds) {
        seconds = Math.max(0, Math.floor(seconds));

        const hours = Math.floor(seconds / 3600);

        const minutes = Math.floor((seconds % 3600) / 60);

        const secs = seconds % 60;

        if (hours > 0) {
          return [
            String(hours).padStart(2, "0"),
            String(minutes).padStart(2, "0"),
            String(secs).padStart(2, "0"),
          ].join(":");
        }

        return [
          String(minutes).padStart(2, "0"),
          String(secs).padStart(2, "0"),
        ].join(":");
      }

      function calculateCycles() {
        const { maxSession, focus, rest } = getSettings();

        let remainingSession = maxSession;

        let totalCycles = 0;

        while (remainingSession > 0) {
          totalCycles++;

          const focusTime = Math.min(focus, remainingSession);

          remainingSession -= focusTime;

          if (remainingSession <= 0) {
            break;
          }

          remainingSession -= Math.min(rest, remainingSession);
        }

        return totalCycles;
      }

      function updateInterface() {
        const settings = getSettings();

        const totalCycles = calculateCycles();

        timerElement.textContent = formatTime(remaining);

        sessionDisplay.textContent = formatTime(
          Math.max(0, settings.maxSession * 60 - sessionElapsed)
        );

        cycleDisplay.textContent = `${cycle} / ${totalCycles}`;

        completedCyclesElement.textContent = completedCycles;

        modeDisplay.textContent = mode === "focus" ? "FOCUS" : "REST";

        statusElement.textContent =
          mode === "focus" ? "PROGRAMMING IN PROGRESS" : "REST PERIOD";

        statusElement.classList.toggle("rest", mode === "rest");

        timerElement.classList.toggle("rest", mode === "rest");

        document.body.classList.toggle("rest-mode", mode === "rest");

        const currentDuration =
          mode === "focus" ? getCurrentFocusDuration() : settings.rest * 60;

        const progress =
          currentDuration > 0
            ? ((currentDuration - remaining) / currentDuration) * 100
            : 0;

        progressBar.style.width = `${Math.min(100, progress)}%`;
      }

      function getCurrentFocusDuration() {
        const settings = getSettings();

        const remainingSession = settings.maxSession * 60 - sessionElapsed;

        return Math.min(settings.focus * 60, remainingSession);
      }

      function startSession() {
        if (running) {
          return;
        }

        if (remaining <= 0) {
          const settings = getSettings();

          remaining = Math.min(settings.focus * 60, settings.maxSession * 60);
        }

        running = true;

        startButton.disabled = true;

        timer = setInterval(tick, 1000);

        updateInterface();
      }

      function pauseSession() {
        running = false;

        clearInterval(timer);

        timer = null;

        startButton.disabled = false;

        statusElement.textContent = "SESSION PAUSED";

        updateInterface();
      }

      function resetSession() {
        clearInterval(timer);

        timer = null;

        running = false;

        mode = "focus";

        sessionElapsed = 0;

        completedCycles = 0;

        cycle = 1;

        const settings = getSettings();

        remaining = Math.min(settings.focus * 60, settings.maxSession * 60);

        document.body.classList.remove("finished", "rest-mode");

        startButton.disabled = false;

        updateInterface();
      }

      function tick() {
        if (remaining > 0) {
          remaining--;

          if (mode === "focus") {
            sessionElapsed++;
          } else {
            /*
             * Descanso não conta como tempo
             * de programação.
             */
          }

          updateInterface();

          return;
        }

        changePhase();
      }

      function changePhase() {
        const settings = getSettings();

        if (mode === "focus") {
          completedCycles++;

          const sessionLimit = settings.maxSession * 60;

          if (sessionElapsed >= sessionLimit) {
            finishSession();

            return;
          }

          const remainingSession = sessionLimit - sessionElapsed;

          const restDuration = Math.min(settings.rest * 60, remainingSession);

          mode = "rest";

          remaining = restDuration;

          updateInterface();

          playBeep();

          return;
        }

        mode = "focus";

        cycle++;

        const remainingSession = settings.maxSession * 60 - sessionElapsed;

        if (remainingSession <= 0) {
          finishSession();

          return;
        }

        remaining = Math.min(settings.focus * 60, remainingSession);

        updateInterface();

        playBeep();
      }

      function finishSession() {
        clearInterval(timer);

        timer = null;

        running = false;

        remaining = 0;

        startButton.disabled = false;

        statusElement.textContent = "SESSION COMPLETE";

        modeDisplay.textContent = "DONE";

        document.body.classList.add("finished");

        progressBar.style.width = "100%";

        playBeep();

        updateInterface();
      }

      function playBeep() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;

          const context = new AudioContext();

          const oscillator = context.createOscillator();

          const gain = context.createGain();

          oscillator.frequency.value = 440;

          oscillator.type = "sine";

          gain.gain.setValueAtTime(0.001, context.currentTime);

          gain.gain.exponentialRampToValueAtTime(
            0.15,
            context.currentTime + 0.02
          );

          gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.5
          );

          oscillator.connect(gain);

          gain.connect(context.destination);

          oscillator.start();

          oscillator.stop(context.currentTime + 0.5);
        } catch (error) {
          console.log("Audio indisponível.");
        }
      }

      startButton.addEventListener("click", startSession);

      pauseButton.addEventListener("click", pauseSession);

      resetButton.addEventListener("click", resetSession);

      [maxHoursInput, focusInput, restInput].forEach((input) => {
        input.addEventListener("change", resetSession);
      });

      resetSession();
    </script>
  </body>
</html>
